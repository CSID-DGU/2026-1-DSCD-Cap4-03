services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/cap4cap4
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "cap4cap4", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rouple-backend:latest
    env_file:
      - ./backend/.env
    environment:
      USE_LOCAL_SQLITE: "false"
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cap4cap4
      SKIN_MODEL_CHECKPOINT: /app/model/skin_analysis/best_260507_21.pt
      EMBED_LOCAL_FILES_ONLY: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - /opt/rouple/model_artifacts/skin_analysis/best_260507_21.pt:/app/model/skin_analysis/best_260507_21.pt:ro
      - /opt/rouple/model_artifacts/embedding_results:/app/model/recommendation/embedding_pipeline/embedding_results:ro
      - /opt/rouple/huggingface_cache:/root/.cache/huggingface
      - ./backend/llm_outputs:/app/backend/llm_outputs
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: rouple-frontend:latest
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
